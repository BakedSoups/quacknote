services:
  languagetool:
    build: ./docker/languagetool
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - proofreading
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/v2/languages"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

networks:
  proofreading:
    internal: true
